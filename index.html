<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oasis</title>

  <!-- iOS App Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Oasis">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d0221'/><text x='50' y='70' font-size='65' font-weight='bold' font-family='sans-serif' fill='%2300f6ff' text-anchor='middle'>O</text></svg>">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d0221;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: monospace;
    }
    canvas {
      border: 2px solid #00f6ff;
      box-shadow: 0 0 15px #00f6ff;
      touch-action: manipulation;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="360" height="640"></canvas>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const groundY = 540;
  let score = 0;
  let highScore = localStorage.getItem("oasis_highscore") || 0;
  let gameOver = false;
  let gameWon = false;

  const player = {
    x: 50,
    y: groundY,
    width: 20,
    height: 30,
    vy: 0,
    gravity: 0.6,
    jumping: false
  };

  const obstacle = {
    x: 400,
    y: groundY + 5,
    width: 25,
    height: 25,
    speed: 4
  };

  const keyItem = {
    x: 600,
    y: groundY - 80,
    width: 15,
    height: 15,
    collected: false
  };

  function resetGame() {
    score = 0;
    gameOver = false;
    gameWon = false;
    player.y = groundY;
    player.vy = 0;
    player.jumping = false;
    obstacle.x = 400;
    keyItem.x = 600;
    keyItem.collected = false;
  }

  function drawCyberCity() {
    // Sky
    let sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
    sky.addColorStop(0, '#0d0221');
    sky.addColorStop(0.6, '#261447');
    sky.addColorStop(1, '#ff3864');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Back Buildings
    ctx.fillStyle = '#150a2a';
    [{x:0,w:50,h:220},{x:45,w:45,h:300},{x:85,w:70,h:180},{x:150,w:50,h:260},{x:195,w:65,h:340},{x:255,w:55,h:200},{x:305,w:60,h:280}].forEach(b => {
      ctx.fillRect(b.x, canvas.height - b.h, b.w, b.h);
    });

    // Front Buildings with Neon Windows
    ctx.fillStyle = '#0a0518';
    [{x:10,w:50,h:150},{x:70,w:60,h:220},{x:135,w:45,h:120},{x:185,w:70,h:190},{x:260,w:50,h:140},{x:315,w:45,h:210}].forEach(b => {
      let y = canvas.height - b.h;
      ctx.fillRect(b.x, y, b.w, b.h);
      ctx.fillStyle = '#00f6ff';
      for (let wx = b.x + 6; wx < b.x + b.w - 6; wx += 10) {
        for (let wy = y + 12; wy < canvas.height - 20; wy += 16) {
          if ((wx + wy) % 3 === 0) ctx.fillRect(wx, wy, 4, 6);
        }
      }
      ctx.fillStyle = '#0a0518';
    });
  }

  function update() {
    if (gameOver || gameWon) return;

    player.vy += player.gravity;
    player.y += player.vy;

    if (player.y >= groundY) {
      player.y = groundY;
      player.vy = 0;
      player.jumping = false;
    }

    obstacle.x -= obstacle.speed;
    if (obstacle.x < -30) {
      obstacle.x = 360 + Math.random() * 100;
      score += 10;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem("oasis_highscore", highScore);
      }
    }

    if (!keyItem.collected) {
      keyItem.x -= 2;
      if (keyItem.x < -30) keyItem.x = 500;
    }

    // Collisions
    if (
      player.x < obstacle.x + obstacle.width &&
      player.x + player.width > obstacle.x &&
      player.y < obstacle.y + obstacle.height &&
      player.y + player.height > obstacle.y
    ) {
      gameOver = true;
    }

    if (
      !keyItem.collected &&
      player.x < keyItem.x + keyItem.width &&
      player.x + player.width > keyItem.x &&
      player.y < keyItem.y + keyItem.height &&
      player.y + player.height > keyItem.y
    ) {
      keyItem.collected = true;
      gameWon = true;
    }
  }

  function draw() {
    // 1. Draw City Background
    drawCyberCity();

    // 2. Ground
    ctx.strokeStyle = '#ff3864';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, groundY + 30);
    ctx.lineTo(canvas.width, groundY + 30);
    ctx.stroke();

    // 3. Player (Parzival)
    ctx.fillStyle = '#00f6ff';
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // 4. Sixer Obstacle
    ctx.fillStyle = '#ff3864';
    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);

    // 5. Copper Key
    if (!keyItem.collected) {
      ctx.fillStyle = '#e5c158';
      ctx.fillRect(keyItem.x, keyItem.y, keyItem.width, keyItem.height);
    }

    // 6. UI Text
    ctx.fillStyle = '#00f6ff';
    ctx.font = '14px monospace';
    ctx.fillText("SCORE: " + score, 15, 30);
    ctx.fillText("BEST: " + highScore, 15, 50);
    ctx.fillText("KEY: " + (keyItem.collected ? "FOUND!" : "SEARCHING..."), 200, 30);

    if (gameOver) {
      ctx.fillStyle = '#ff3864';
      ctx.font = '20px monospace';
      ctx.fillText("ZEROED OUT!", 110, 280);
      ctx.font = '12px monospace';
      ctx.fillText("Tap to Re-enter OASIS", 105, 310);
    }

    if (gameWon) {
      ctx.fillStyle = '#e5c158';
      ctx.font = '18px monospace';
      ctx.fillText("COPPER KEY ACQUIRED!", 70, 280);
      ctx.font = '12px monospace';
      ctx.fillText("Tap to Play Again", 115, 310);
    }
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  function handleInput() {
    if (gameOver || gameWon) {
      resetGame();
    } else if (!player.jumping) {
      player.vy = -12;
      player.jumping = true;
    }
  }

  window.addEventListener("touchstart", handleInput);
  window.addEventListener("mousedown", handleInput);

  gameLoop();
</script>

</body>
</html>
