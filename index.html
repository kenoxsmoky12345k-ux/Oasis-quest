<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OASIS: The Copper Key Quest</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f0c20;
            color: #00ffff;
            font-family: sans-serif;
            text-align: center;
            touch-action: manipulation;
        }
        h1 { margin: 10px 0 5px 0; font-size: 20px; text-shadow: 0 0 10px #00ffff; }
        p { margin: 0 0 10px 0; font-size: 13px; color: #aaa; }
        canvas {
            background: #18152e;
            border: 2px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            display: block;
            margin: 0 auto;
            max-width: 95vw;
        }
    </style>
</head>
<body>
    <h1>OASIS: COPPER KEY QUEST</h1>
    <p>Tap screen to Jump | Avoid Sixers | Grab Key</p>
    <canvas id="gameCanvas" width="360" height="480"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let hasKey = false;
        let gameOver = false;
        let gameWon = false;

        let player = { x: 40, y: 380, width: 30, height: 30, vy: 0, gravity: 0.6, jumping: false };
        const groundY = 380;

        let obstacle = { x: 360, y: 380, width: 25, height: 30, speed: 4 };
        let keyItem = { x: 500, y: 300, width: 20, height: 20, collected: false };

        function jump() {
            if (gameOver || gameWon) {
                resetGame();
                return;
            }
            if (!player.jumping) {
                player.vy = -12;
                player.jumping = true;
            }
        }

        window.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); }, { passive: false });
        window.addEventListener("mousedown", jump);

        function resetGame() {
            score = 0;
            hasKey = false;
            gameOver = false;
            gameWon = false;
            player.y = groundY;
            player.vy = 0;
            player.jumping = false;
            obstacle.x = 400;
            keyItem.x = 600;
            keyItem.collected = false;
        }

        function update() {
            if (gameOver || gameWon) return;

            player.vy += player.gravity;
            player.y += player.vy;

            if (player.y >= groundY) {
                player.y = groundY;
                player.vy = 0;
                player.jumping = false;
            }

            obstacle.x -= obstacle.speed;
            if (obstacle.x < -30) {
                obstacle.x = 360 + Math.random() * 120;
                score += 10;
            }

            if (!keyItem.collected) {
                keyItem.x -= 2;
                if (keyItem.x < -30) keyItem.x = 500;
            }

            if (
                player.x < obstacle.x + obstacle.width &&
                player.x + player.width > obstacle.x &&
                player.y < obstacle.y + obstacle.height &&
                player.y + player.height > obstacle.y
            ) {
                gameOver = true;
            }

            if (
                !keyItem.collected &&
                player.x < keyItem.x + keyItem.width &&
                player.x + player.width > keyItem.x &&
                player.y < keyItem.y + keyItem.height &&
                player.y + player.height > keyItem.y
            ) {
                keyItem.collected = true;
                hasKey = true;
                gameWon = true;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00ffff";
            ctx.fillRect(0, groundY + 30, canvas.width, 100);

            ctx.fillStyle = "#00ff88";
            ctx.fillRect(player.x, player.y, player.width, player.height);

            ctx.fillStyle = "#ff0055";
            ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);

            if (!keyItem.collected) {
                ctx.fillStyle = "#ffcc00";
                ctx.fillRect(keyItem.x, keyItem.y, keyItem.width, keyItem.height);
            }

            ctx.fillStyle = "#ffffff";
            ctx.font = "14px sans-serif";
            ctx.fillText("OASIS COINS: " + score, 15, 30);
            ctx.fillText("KEY: " + (hasKey ? "FOUND!" : "SEARCHING..."), 210, 30);

            if (gameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff0055";
                ctx.font = "24px sans-serif";
                ctx.fillText("ZEROED OUT!", 100, 220);
                ctx.fillStyle = "#ffffff";
                ctx.font = "16px sans-serif";
                ctx.fillText("Tap screen to restart", 105, 260);
            }

            if (gameWon) {
                ctx.fillStyle = "rgba(0,0,0,0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ffcc00";
                ctx.font = "20px sans-serif";
                ctx.fillText("COPPER KEY UNLOCKED!", 55, 220);
                ctx.fillStyle = "#ffffff";
                ctx.font = "16px sans-serif";
                ctx.fillText("Tap screen to play again", 95, 260);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
